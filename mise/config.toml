[settings]
asdf_compat = false
legacy_version_file = false
lockfile = true
lockfile_platforms = ["linux-arm64", "macos-arm64"]
not_found_auto_install = false
ruby.compile = false

[tools]
go = "1.27"
node = "24"
npm = "12"
ruby = "4.0"
python = "3.15"
bun = "1.4"
rust = "1"

# Service / automation CLIs absent from the pinned Nixpkgs release.
"npm:@googleworkspace/cli" = "0.22.5"
"npm:@steipete/summarize" = "0.25.3"
"npm:@playwright/cli" = "0.1.22"
"npm:@karakeep/cli" = "0.34.0"
# Keep the existing ACP adapter contract until its consumers migrate together.
"npm:@agentclientprotocol/codex-acp" = "1.13.0"
