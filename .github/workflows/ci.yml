name: Scripts Test

on:
  push:

jobs:
  linux-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Linux shell syntax
        run: for f in bin/install.linux.sh bin/link.linux.sh bin/link.linux.test.sh; do bash -n "$f"; done
      - name: Verify configuration restore
        run: bash bin/link.linux.test.sh
