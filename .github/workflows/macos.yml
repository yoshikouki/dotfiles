name: macOS Install

# bin/install.mac.sh clones main into ~/dotfiles, so only main is tested for real.
on:
  push:
    branches: [main]
    paths:
      - Makefile
      - bin/install.mac.sh
      - bin/install_applications.sh
      - bin/macos-defaults.sh
      - .Brewfile
      - .gitconfig
      - .gitconfig.macos
      - .zshenv
      - .zprofile
      - .zlogin
      - mise/**
      - yazi/package.toml
      - .github/workflows/macos.yml
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: test install scripts
        run: make install
      - name: test macos defaults
        run: make macos
      - name: test install applications
        run: make applications
